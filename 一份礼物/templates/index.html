<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一份神秘的礼物</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "微软雅黑", "PingFang SC", "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    overflow: hidden;
    position: relative;
}

/* 漂浮的背景装饰 */
.bg-decoration {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
}

.circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    animation: float 20s infinite ease-in-out;
}

.circle:nth-child(1) {
    width: 80px;
    height: 80px;
    top: 10%;
    left: 10%;
    animation-delay: 0s;
}

.circle:nth-child(2) {
    width: 120px;
    height: 120px;
    top: 60%;
    left: 80%;
    animation-delay: 2s;
}

.circle:nth-child(3) {
    width: 60px;
    height: 60px;
    top: 80%;
    left: 20%;
    animation-delay: 4s;
}

.circle:nth-child(4) {
    width: 100px;
    height: 100px;
    top: 20%;
    left: 70%;
    animation-delay: 1s;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.6;
    }
    50% {
        transform: translateY(-30px) rotate(180deg);
        opacity: 0.3;
    }
}

.card {
    width: 340px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 40px 32px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25), 
                0 10px 20px rgba(0, 0, 0, 0.15);
    text-align: center;
    position: relative;
    animation: cardEnter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 10;
}

@keyframes cardEnter {
    0% {
        transform: scale(0.8) translateY(30px);
        opacity: 0;
    }
    100% {
        transform: scale(1) translateY(0);
        opacity: 1;
    }
}

.icon {
    font-size: 64px;
    margin-bottom: 20px;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-10px);
    }
}

.title {
    font-size: 22px;
    color: #2d3748;
    font-weight: 600;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
}

.subtitle {
    font-size: 14px;
    color: #718096;
    margin-bottom: 28px;
    line-height: 1.6;
}

.line {
    height: 1px;
    background: linear-gradient(to right, transparent, #e2e8f0, transparent);
    margin: 24px 0;
}

.btn {
    width: 100%;
    padding: 14px 28px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    position: relative;
    overflow: hidden;
}

.btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

.btn:hover::before {
    width: 300px;
    height: 300px;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
}

.btn:active {
    transform: translateY(0);
}

.btn-text {
    position: relative;
    z-index: 1;
}

/* 闪烁的小星星 */
.sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    animation: sparkle 1.5s infinite;
}

.sparkle:nth-child(1) {
    top: 15%;
    left: 15%;
    animation-delay: 0s;
}

.sparkle:nth-child(2) {
    top: 25%;
    right: 20%;
    animation-delay: 0.3s;
}

.sparkle:nth-child(3) {
    bottom: 20%;
    left: 25%;
    animation-delay: 0.6s;
}

.sparkle:nth-child(4) {
    bottom: 30%;
    right: 15%;
    animation-delay: 0.9s;
}

@keyframes sparkle {
    0%, 100% {
        opacity: 0;
        transform: scale(0);
    }
    50% {
        opacity: 1;
        transform: scale(1);
    }
}
</style>
</head>
<body>

<!-- 背景装饰 -->
<div class="bg-decoration">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<div class="card">
    <!-- 闪烁星星 -->
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    
    <div class="icon">🎁</div>
    <div class="title">一份神秘的礼物</div>
    <div class="subtitle">您收到一份神秘的礼物<br>确定要打开吗</div>
    <div class="line"></div>
    <button class="btn" onclick="goStart()">
        <span class="btn-text">确定 ✨</span>
    </button>
</div>

<script>
function goStart() {
    window.location.href = "/start";
}
</script>

</body>
</html>
