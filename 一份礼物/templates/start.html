<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神秘礼物</title>
<style>
body {
    margin: 0;
    background: white;
    overflow: hidden;
    font-family: "微软雅黑", sans-serif;
    height: 100vh;
}
.tip {
    position: absolute;
    width: 200px;
    padding: 12px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
    color: #222;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2), 0 3px 8px rgba(0,0,0,0.1);
    animation: pop 0.25s ease-out;
}
.tag {
    position: absolute;
    top: 6px;
    right: 10px;
    font-size: 11px;
    color: #666;
}
.line {
    width: 100%;
    height: 1px;
    background: #ddd;
    margin: 6px 0 8px 0;
}
@keyframes pop {
    0% {transform: scale(0.6); opacity: 0;}
    100% {transform: scale(1); opacity: 1;}
}
.loading {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 18px;
    color: #666;
}
.error {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 16px;
    color: #f44336;
    text-align: center;
    padding: 20px;
}
</style>
</head>
<body>

<!-- 背景音乐 -->
<audio id="bgm" preload="none">
  <source src="/static/music.mp3" type="audio/mpeg">
</audio>

<div class="loading" id="loading">点击打开礼物</div>

<script>
// 备用祝福数据（如果后端连接失败就用这个）
const fallbackTips = [
    "大傻逼🙃",
    "要天天开心😆",
    "多喝沸水~😁",
    "顺顺利利",
    "梦想成真😆",
    "不知道写什么",
    "你是最棒的!!",
    "不要熬夜",
    "金榜题名",
    "新年快乐🧧",
    "臭傻逼🙃",
    "前程似锦",
    "心想事成",
    "早点休息",
    "新年快乐🧧"
];

// 超时请求函数
async function fetchWithTimeout(url, timeout = 5000) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeout);
    
    try {
        const response = await fetch(url, {
            signal: controller.signal
        });
        clearTimeout(id);
        return response;
    } catch (error) {
        clearTimeout(id);
        throw error;
    }
}

window.addEventListener("click", async ()=>{
    const loadingDiv = document.getElementById("loading");
    loadingDiv.textContent = "加载中...";
    
    // 播放音乐
    const audio = document.getElementById("bgm");
    audio.load();
    audio.play().catch(()=>{});

    let tips = fallbackTips; // 默认使用备用数据
    
    // 尝试从后端获取数据
    try {
        console.log("开始请求 /tips...");
        const response = await fetchWithTimeout('/tips', 5000); // 5秒超时
        console.log("响应状态:", response.status);
        
        if (response.ok) {
            tips = await response.json();
            console.log("成功获取数据:", tips);
        } else {
            console.warn("后端返回错误，使用备用数据");
        }
    } catch (error) {
        console.error("无法连接后端，使用备用数据:", error.message);
    }

    // 隐藏加载提示
    loadingDiv.style.display = "none";

    const total = 100;
    const totalDuration = 5000;
    const batchSize = 5;
    const interval = totalDuration / total * batchSize;
    let current = 0;

    const colors = ["#fff0f3","#eef3ff","#eafff3","#fff8e8","#f0f7ff","#f9f0ff"];

    const timer = setInterval(()=>{
        if(current >= total){
            clearInterval(timer);
            return;
        }

        const fragment = document.createDocumentFragment();

        for(let i=0;i<batchSize && current<total;i++,current++){
            const div = document.createElement("div");
            div.className = "tip";
            div.style.background = colors[Math.floor(Math.random()*colors.length)];

            const tag = document.createElement("div");
            tag.className = "tag";
            tag.innerText = "💌";

            const line = document.createElement("div");
            line.className = "line";

            const content = document.createElement("div");
            content.innerText = tips[current % tips.length];

            div.appendChild(tag);
            div.appendChild(line);
            div.appendChild(content);

            div.style.left = Math.random()*(window.innerWidth-200)+"px";
            div.style.top  = Math.random()*(window.innerHeight-120)+"px";

            fragment.appendChild(div);
        }

        document.body.appendChild(fragment);
    }, interval);
}, {once:true});
</script>

</body>
</html>
